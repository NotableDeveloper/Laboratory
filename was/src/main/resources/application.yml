spring:
  application:
    name: dmz-was
  profiles:
    active: default

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.dmz: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/dmz-was.log

---
# Docker 프로필
spring:
  config:
    activate:
      on-profile: docker

server:
  port: 8080
