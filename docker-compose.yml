version: '3.8'

services:
  # Internal WAS (Private Zone)
  was:
    build:
      context: ./was
      dockerfile: Dockerfile
    container_name: dmz-was
    networks:
      - private-net
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./was/logs:/app/logs
    expose:
      - "8080"

  # DMZ Nginx (Public Zone - Gateway)
  nginx:
    image: nginx:latest
    container_name: dmz-nginx
    networks:
      - public-net
      - private-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/html:/usr/share/nginx/html
    depends_on:
      - was

networks:
  # Public Zone (호스트와 통신)
  public-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16

  # Private Zone (WAS 격리)
  private-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
