plugins {
    id 'java'
}

group = 'study'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Junit5
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.28'
    annotationProcessor 'org.projectlombok:lombok:1.18.28'
    testCompileOnly 'org.projectlombok:lombok:1.18.28'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.28'

    // SLF4J
    implementation 'org.slf4j:slf4j-api:1.7.36'

    // Logback (SLF4J provider 포함)
    implementation 'ch.qos.logback:logback-classic:1.2.11'
    implementation 'ch.qos.logback:logback-core:1.2.11'
    implementation 'ch.qos.logback:logback-access:1.2.9'

    // Mybatis
    implementation 'org.mybatis:mybatis:3.5.19'

    // MySQL
    implementation 'com.mysql:mysql-connector-j:9.5.0'
}

test {
    useJUnitPlatform()
}

sourceSets {
    main {
        resources {
            srcDirs = ["src/main/resources", "src/main/java"]
            includes = ["**/*.xml"]
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

task runXmlSqlSessionExample(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'SqlSession.example.BuildSqlSessionWithXML'
}

task runJavaSqlSessionExample(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'SqlSession.example.BuildSqlSessionWithJava'
}

task runSqlSessionLifecycleExample(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'SqlSession.example.SqlSessionLifecycle'
}

task runMybatisConfigurationExample(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'SqlSession.example.MybatisConfiguration'
}

// === SQL 매핑 예제 (4. SQL Mapping) ===
task runSqlMappingCrudExample(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'SqlMapping.CrudExample'
}

task runSqlMappingResultMapExample(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'SqlMapping.ResultMapExample'
}

// === 동적 SQL 예제 (5. Dynamic SQL) ===
task runDynamicSqlExample(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'DynamicSql.DynamicSqlExample'
}

// === 캐시 예제 (6. Cache) ===
task runFirstLevelCacheExample(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'Cache.FirstLevelCacheExample'
}

task runSecondLevelCacheExample(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'Cache.SecondLevelCacheExample'
}

// === Java API 예제 (7. Java API) ===
task runAnnotationMappingExample(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'JavaApi.AnnotationMappingExample'
}

task runSqlBuilderExample(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'JavaApi.SqlBuilderExample'
}