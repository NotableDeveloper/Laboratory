plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

application {
    mainClassName = 'jgit.server.GitRepositoryTcpServer'
}

group = 'study'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Junit5
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // YAML
    implementation 'org.yaml:snakeyaml:2.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.28'
    annotationProcessor 'org.projectlombok:lombok:1.18.28'
    testCompileOnly 'org.projectlombok:lombok:1.18.28'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.28'

    // JSON
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.10'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.10'

    // SLF4J
    implementation 'org.slf4j:slf4j-api:1.7.36'

    // Logback (SLF4J provider 포함)
    implementation 'ch.qos.logback:logback-classic:1.2.11'
    implementation 'ch.qos.logback:logback-core:1.2.11'
    implementation 'ch.qos.logback:logback-access:1.2.9'

    // Netty
    implementation 'io.netty:netty-all:4.1.107.Final'

    // JGit
    implementation 'org.eclipse.jgit:org.eclipse.jgit:5.13.3.202401111512-r'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

shadowJar {
    archiveFileName = 'Laboratory.jar'
    manifest {
        attributes 'Main-Class': 'jgit.server.GitRepositoryTcpServer'
    }
}