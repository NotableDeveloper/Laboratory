<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Client</title>
</head>
<body>
    <h1>WebSocket Client</h1>
    <p>
        <input type="text" id="message" placeholder="Enter message" />
        <button onclick="sendMessage()">Send</button>
    </p>
    <h2>Log</h2>
    <div id="log" style="border: 1px solid #ccc; padding: 10px; height: 200px; overflow-y: scroll;"></div>

    <script>
        var socket;
        var log = document.getElementById("log");

        function connect() {
            var host = "ws://127.0.0.1:8081/websocket";
            try {
                socket = new WebSocket(host);

                socket.onopen = function() {
                    log.innerHTML += "<p>Socket Status: " + socket.readyState + " (open)</p>";
                }

                socket.onmessage = function(msg) {
                    log.innerHTML += "<p>Received: " + msg.data + "</p>";
                }

                socket.onclose = function() {
                    log.innerHTML += "<p>Socket Status: " + socket.readyState + " (closed)</p>";
                }

            } catch(exception) {
                log.innerHTML += "<p>Error: " + exception + "</p>";
            }
        }

        function sendMessage() {
            var message = document.getElementById("message").value;
            if (!message) {
                return;
            }
            socket.send(message);
            log.innerHTML += "<p>Sent: " + message + "</p>";
            document.getElementById("message").value = "";
        }
        
        window.onload = connect;

    </script>
</body>
</html>
